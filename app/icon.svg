<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <defs>
    <linearGradient id="appicon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <linearGradient id="appicon-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC837" />
      <stop offset="50%" stop-color="#FFAA00" />
      <stop offset="100%" stop-color="#E67E00" />
    </linearGradient>
    <linearGradient id="appicon-check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="50%" stop-color="#FFAA00" />
      <stop offset="100%" stop-color="#FF8800" />
    </linearGradient>
    <radialGradient id="appicon-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFAA00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFAA00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="40" height="40" rx="10" fill="url(#appicon-bg)" stroke="#FFAA00" stroke-width="1.5" stroke-opacity="0.45" />
  <circle cx="22" cy="20" r="16" fill="url(#appicon-glow)" />

  <g>
    <!-- Top Diamond -->
    <path d="M 22 9 L 36 16 L 22 23 L 8 16 Z" fill="url(#appicon-amber)" />
    <!-- Highlight -->
    <path d="M 22 9 L 8 16 L 22 23 Z" fill="#FFFFFF" fill-opacity="0.2" />

    <!-- Cap Base -->
    <path d="M 14 19.5 V 23.5 C 14 26.5 30 26.5 30 23.5 V 19.5" stroke="url(#appicon-amber)" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Tassel -->
    <path d="M 33 17 C 34.5 19.5 34.5 22.5 32.5 24.5" stroke="#FFEBA8" stroke-width="1.4" stroke-linecap="round" />
    <circle cx="32" cy="25" r="1.3" fill="#FFEBA8" />
  </g>

  <!-- Modern Dynamic Checkmark -->
  <path d="M 12 25 L 18.5 31.5 L 33 17" stroke="#0B1120" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 12 25 L 18.5 31.5 L 33 17" stroke="url(#appicon-check)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
