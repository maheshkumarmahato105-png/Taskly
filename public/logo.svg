<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" fill="none">
  <defs>
    <linearGradient id="logo-shield-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <linearGradient id="logo-amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC837" />
      <stop offset="50%" stop-color="#FFAA00" />
      <stop offset="100%" stop-color="#E67E00" />
    </linearGradient>
    <linearGradient id="logo-check-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="50%" stop-color="#FFAA00" />
      <stop offset="100%" stop-color="#FF8800" />
    </linearGradient>
    <radialGradient id="logo-amber-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFAA00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFAA00" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="logo-text-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC837" />
      <stop offset="100%" stop-color="#FFAA00" />
    </linearGradient>
  </defs>

  <!-- Logo Mark (Squircle + Cap + Check) -->
  <g transform="translate(6, 4)">
    <rect x="0" y="0" width="44" height="44" rx="11" fill="url(#logo-shield-bg)" stroke="#FFAA00" stroke-width="1.5" stroke-opacity="0.45" />
    <circle cx="22" cy="22" r="16" fill="url(#logo-amber-glow)" />

    <!-- Cap -->
    <path d="M 22 10 L 36 17 L 22 24 L 8 17 Z" fill="url(#logo-amber-grad)" />
    <path d="M 22 10 L 8 17 L 22 24 Z" fill="#FFFFFF" fill-opacity="0.2" />
    <path d="M 14 20.5 V 24.5 C 14 27.5 30 27.5 30 24.5 V 20.5" stroke="url(#logo-amber-grad)" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M 33 18 C 34.5 20.5 34.5 23.5 32.5 25.5" stroke="#FFEBA8" stroke-width="1.4" stroke-linecap="round" />
    <circle cx="32" cy="26" r="1.3" fill="#FFEBA8" />

    <!-- Checkmark -->
    <path d="M 12 26 L 18.5 32.5 L 33 18" stroke="#0B1120" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 12 26 L 18.5 32.5 L 33 18" stroke="url(#logo-check-grad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <g transform="translate(60, 0)">
    <!-- Brand Title -->
    <text x="0" y="27" font-family="Inter, -apple-system, sans-serif" font-size="19" font-weight="900" letter-spacing="-0.3" fill="#FFFFFF">
      EasyMy<tspan fill="url(#logo-text-gold)">Learning</tspan>
    </text>
    <!-- Subtitle -->
    <text x="0" y="42" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="1.8" fill="#FFAA00">
      TASK MANAGER
    </text>
  </g>
</svg>
